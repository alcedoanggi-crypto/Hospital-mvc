{% extends "base.html" %}
{% block title %}{{ 'Editar' if modo == 'editar' else 'Nuevo' }} medico{% endblock %}
{% block page_title %}{{ 'Editar' if modo == 'editar' else 'Nuevo' }} medico{% endblock %}
{% block content %}
<form method="post" class="card-soft p-4" style="max-width:720px">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Nombres *</label>
      <input name="nombres" class="form-control" value="{{ medico.nombres or '' }}" required></div>
    <div class="col-md-6"><label class="form-label">Apellidos *</label>
      <input name="apellidos" class="form-control" value="{{ medico.apellidos or '' }}" required></div>
    <div class="col-md-6"><label class="form-label">Colegiatura *</label>
      <input name="colegiatura" class="form-control" value="{{ medico.colegiatura or '' }}" required></div>
    <div class="col-md-6"><label class="form-label">Telefono</label>
      <input name="telefono" class="form-control" value="{{ medico.telefono or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Especialidad *</label>
      <select name="especialidad_id" class="form-select" required>
        <option value="">Selecciona...</option>
        {% for e in especialidades %}
        <option value="{{ e.id }}" {{ 'selected' if medico.especialidad_id == e.id }}>{{ e.nombre }}</option>
        {% endfor %}
      </select></div>
    <div class="col-md-6 d-flex align-items-end">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="activo" id="activo" {{ 'checked' if medico.activo or modo == 'crear' }}>
        <label class="form-check-label" for="activo">Activo</label>
      </div>
    </div>
  </div>
  <div class="mt-4"><button class="btn btn-brand">Guardar</button>
    <a href="{{ url_for('medicos.index') }}" class="btn btn-link">Cancelar</a></div>
</form>
{% endblock %}
