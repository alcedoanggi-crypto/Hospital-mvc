{% extends "base.html" %}
{% block title %}Solicitar examen{% endblock %}
{% block page_title %}Solicitar examen{% endblock %}
{% block content %}
<form method="post" class="card-soft p-4" style="max-width:680px">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Paciente *</label>
      <select name="paciente_id" class="form-select" required>
        <option value="">Selecciona...</option>
        {% for p in pacientes %}<option value="{{ p.id }}">{{ p.nombre_completo }} ({{ p.dni }})</option>{% endfor %}
      </select></div>
    <div class="col-md-6"><label class="form-label">Medico solicitante *</label>
      <select name="medico_id" class="form-select" required>
        <option value="">Selecciona...</option>
        {% for m in medicos %}<option value="{{ m.id }}">{{ m.nombre_completo }}</option>{% endfor %}
      </select></div>
    <div class="col-12"><label class="form-label">Tipo de examen *</label>
      <input name="tipo" class="form-control" placeholder="Hemograma, Radiografia de torax..." required></div>
    <div class="col-12"><label class="form-label">Descripcion / indicaciones</label>
      <textarea name="descripcion" class="form-control" rows="3"></textarea></div>
  </div>
  <div class="mt-4"><button class="btn btn-brand">Solicitar</button>
    <a href="{{ url_for('examenes.index') }}" class="btn btn-link">Cancelar</a></div>
</form>
{% endblock %}
