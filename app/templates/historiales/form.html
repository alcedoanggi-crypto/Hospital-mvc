{% extends "base.html" %}
{% block title %}Nueva entrada de historial{% endblock %}
{% block page_title %}Registrar atencion clinica{% endblock %}
{% block content %}
<form method="post" class="card-soft p-4" style="max-width:820px">
  <input type="hidden" name="cita_id" value="{{ h.cita_id or '' }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Paciente *</label>
      <select name="paciente_id" class="form-select" required>
        <option value="">Selecciona...</option>
        {% for p in pacientes %}
        <option value="{{ p.id }}" {{ 'selected' if h.paciente_id == p.id }}>{{ p.nombre_completo }} ({{ p.dni }})</option>
        {% endfor %}
      </select></div>
    <div class="col-md-6"><label class="form-label">Medico *</label>
      <select name="medico_id" class="form-select" required>
        <option value="">Selecciona...</option>
        {% for m in medicos %}<option value="{{ m.id }}">{{ m.nombre_completo }}</option>{% endfor %}
      </select></div>
    <div class="col-12"><label class="form-label">Motivo de consulta</label>
      <input name="motivo_consulta" class="form-control" value="{{ h.motivo_consulta or '' }}"></div>
    <div class="col-12"><label class="form-label">Diagnostico *</label>
      <textarea name="diagnostico" class="form-control" rows="2" required>{{ h.diagnostico or '' }}</textarea></div>
    <div class="col-12"><label class="form-label">Tratamiento</label>
      <textarea name="tratamiento" class="form-control" rows="2">{{ h.tratamiento or '' }}</textarea></div>
    <div class="col-md-6"><label class="form-label">Observaciones</label>
      <textarea name="observaciones" class="form-control" rows="2">{{ h.observaciones or '' }}</textarea></div>
    <div class="col-md-6"><label class="form-label">Alergias</label>
      <textarea name="alergias" class="form-control" rows="2">{{ h.alergias or '' }}</textarea></div>
  </div>
  <div class="mt-4"><button class="btn btn-brand">Guardar atencion</button></div>
</form>
{% endblock %}
